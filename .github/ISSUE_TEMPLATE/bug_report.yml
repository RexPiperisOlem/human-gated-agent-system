name: Bug report
description: Report a reproducible defect using fictional or anonymized data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include private prompts, credentials, personal information, real collection records, or confidential production data.
  - type: input
    id: agent
    attributes:
      label: Affected agent
      placeholder: "004"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Fictional or anonymized reproduction
    validations:
      required: true

