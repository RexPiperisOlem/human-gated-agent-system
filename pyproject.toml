[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-agent-system"
version = "1.0.0"
description = "A document-first, human-gated reference architecture for twelve narrow agents"
requires-python = ">=3.10"
license = { text = "Proprietary - see LICENSE" }
authors = [{ name = "Repository Owner" }]
dependencies = []

[project.scripts]
public-agent-system = "public_agent_system.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

